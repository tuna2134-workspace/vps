name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vps_test?sslmode=disable
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vps_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Create test databases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE vps_test"
          psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE vps_e2e"

      - name: gofmt check
        run: |
          test -z "$(gofmt -l cmd internal migrations proto tests)" || (gofmt -l cmd internal migrations proto tests && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Unit tests
        run: go test ./internal/... ./tests/integration/...

      - name: E2E tests
        run: go test ./tests/e2e/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout 5m