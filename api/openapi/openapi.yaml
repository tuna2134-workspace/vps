openapi: 3.0.3
info:
  title: VPS Hosting Platform API
  version: 1.0.0
  description: |
    Backend API for a VirtFusion-style VPS hosting platform. This document is
    the contract a future UI team implements against.

    All responses use a consistent envelope:
      * Success: `{"data": ...}`
      * Error:   `{"error": {"code": "...", "message": "..."}}`

    Authentication uses opaque bearer session tokens returned by `POST /v1/auth/login`.
    Long-running operations (VM provisioning, start, stop, reboot, delete) are
    asynchronous: the create/lifecycle endpoints return an `operation_id`, and
    clients poll `GET /v1/operations/{id}` until the status is terminal.
  contact:
    name: Platform Engineering
servers:
  - url: http://localhost:8080
    description: Local development
tags:
    - name: Authentication
    - name: Users
    - name: VMs
    - name: Operations
    - name: Plans
    - name: Networks
    - name: IP Pools
    - name: Clusters
    - name: Nodes
    - name: Billing
    - name: Console
    - name: System

paths:
  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [System]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is not ready

  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new account
      description: >
        Creates a user account. The legal name and billing address are
        required and stored as PII; they are never returned by the API.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/EmailTaken"
  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and obtain a session token
      description: >
        Returns an opaque bearer token. Errors are generic to prevent email
        enumeration. Repeated failures trigger rate limiting / lockout.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              example:
                email: taro@example.com
                password: supersecret1
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out (revoke the current session)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
  /v1/auth/sessions:
    get:
      tags: [Authentication]
      summary: List active sessions
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
  /v1/auth/sessions/{id}:
    delete:
      tags: [Authentication]
      summary: Revoke a session
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/sessions/revoke_all:
    post:
      tags: [Authentication]
      summary: Revoke all sessions except the current one
      operationId: revokeAllSessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All other sessions revoked
  /v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: All other sessions are revoked on success.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "204":
          description: Password changed
        "401":
          $ref: "#/components/responses/InvalidCredentials"
  /v1/users/me:
    get:
      tags: [Users]
      summary: Get the current user profile
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /v1/plans:
    get:
      tags: [Plans]
      summary: List plans
      operationId: listPlans
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
            default: true
          description: Filter to active plans only
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
    post:
      tags: [Plans]
      summary: Create a plan (admin)
      operationId: createPlan
      security:
        - bearerAuth: []
      x-role: support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /v1/plans/{id}:
    get:
      tags: [Plans]
      summary: Get a plan
      operationId: getPlan
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Plans]
      summary: Update a plan (admin)
      description: >
        The current plan definition is snapshotted into the version history.
        Live subscriptions are unaffected.
      operationId: updatePlan
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /v1/plans/{id}/versions:
    get:
      tags: [Plans]
      summary: List plan version history (admin)
      operationId: listPlanVersions
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
  /v1/plans/{id}/active:
    patch:
      tags: [Plans]
      summary: Activate or deactivate a plan (admin)
      operationId: setPlanActive
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
        - name: active
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "204":
          description: Updated

  /v1/networks:
    get:
      tags: [Networks]
      summary: List networks
      operationId: listNetworks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of networks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Network"
    post:
      tags: [Networks]
      summary: Create a network (admin)
      description: Networks always specify the bridge a VM NIC attaches to.
      operationId: createNetwork
      security:
        - bearerAuth: []
      x-role: support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkRequest"
      responses:
        "201":
          description: Network created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
  /v1/networks/{id}:
    get:
      tags: [Networks]
      summary: Get a network
      operationId: getNetwork
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: Network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
  /v1/networks/{id}/pools:
    get:
      tags: [IP Pools]
      summary: List IP pools in a network
      operationId: listPools
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: IP pools
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IPPool"
    post:
      tags: [IP Pools]
      summary: Add an IP pool (admin)
      operationId: addPool
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IPPoolRequest"
      responses:
        "201":
          description: Pool created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPPool"
  /v1/networks/{id}/status:
    patch:
      tags: [Networks]
      summary: Set a network active/inactive (admin)
      operationId: setNetworkStatus
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "204":
          description: Updated

  /v1/clusters:
    get:
      tags: [Clusters]
      summary: List clusters (admin)
      operationId: listClusters
      security:
        - bearerAuth: []
      x-role: support
      responses:
        "200":
          description: Clusters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cluster"
    post:
      tags: [Clusters]
      summary: Create a cluster (admin)
      operationId: createCluster
      security:
        - bearerAuth: []
      x-role: support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
  /v1/nodes:
    get:
      tags: [Nodes]
      summary: List nodes (admin)
      operationId: listNodes
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - name: cluster_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Node"
    post:
      tags: [Nodes]
      summary: Register an agent node (admin)
      operationId: registerNode
      security:
        - bearerAuth: []
      x-role: support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, name, agent_endpoint]
              example:
                cluster_id: 6b17cffa-8f80-441a-b7fb-b22a414f4cdc
                name: node-01
                agent_endpoint: node-01.internal:9001
              properties:
                cluster_id:
                  type: string
                  format: uuid
                name:
                  type: string
                agent_endpoint:
                  type: string
      responses:
        "201":
          description: Node registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
  /v1/nodes/{id}:
    get:
      tags: [Nodes]
      summary: Get a node (admin)
      operationId: getNode
      security:
        - bearerAuth: []
      x-role: support
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /v1/vms:
    get:
      tags: [VMs]
      summary: List the current user's VMs
      operationId: listVMs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of VMs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VM"
    post:
      tags: [VMs]
      summary: Request a new VM
      description: >
        VM creation is asynchronous. Resources are derived from the selected
        plan. An `Idempotency-Key` header makes retries safe: repeating the
        same request returns the same operation and never creates a second VM.
      operationId: createVM
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: Client-generated key for idempotent retries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMRequest"
            examples:
              example:
                value:
                  plan_id: 6b17cffa-8f80-441a-b7fb-b22a414f4cdc
                  network_id: 6b17cffa-8f80-441a-b7fb-b22a414f4cdc
                  image_id: 6b17cffa-8f80-441a-b7fb-b22a414f4cdc
                  hostname: web-01
                  ssh_keys:
                    - - "ssh-ed25519 AAAA..."
      responses:
        "202":
          description: Provisioning started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    example:
                      operation_id: "4f6d1a2b-..."
                      vm_id: "3e7d9c5c-..."
                    properties:
                      operation_id:
                        type: string
                        format: uuid
                      vm_id:
                        type: string
                        format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "402":
          $ref: "#/components/responses/BillingRequired"
        "503":
          $ref: "#/components/responses/NoCapacity"
  /v1/vms/{id}:
    get:
      tags: [VMs]
      summary: Get a VM
      operationId: getVM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [VMs]
      summary: Delete a VM (asynchronous)
      operationId: deleteVM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      responses:
        "202":
          description: Deletion started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Operation"
  /v1/vms/{id}/start:
    post:
      tags: [VMs]
      summary: Start a VM (asynchronous)
      operationId: startVM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "202":
          description: Start requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Operation"
        "409":
          $ref: "#/components/responses/InvalidState"
  /v1/vms/{id}/stop:
    post:
      tags: [VMs]
      summary: Gracefully stop a VM (asynchronous)
      operationId: stopVM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "202":
          description: Stop requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Operation"
        "409":
          $ref: "#/components/responses/InvalidState"
  /v1/vms/{id}/force_stop:
    post:
      tags: [VMs]
      summary: Force-stop a VM (asynchronous)
      operationId: forceStopVM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "202":
          description: Force-stop requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Operation"
  /v1/vms/{id}/reboot:
    post:
      tags: [VMs]
      summary: Reboot a VM (asynchronous)
      operationId: rebootVM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "202":
          description: Reboot requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Operation"
  /v1/vms/{id}/console:
    post:
      tags: [Console]
      summary: Obtain a one-time VNC console token
      description: >
        The returned token authorizes a WebSocket connection to the console
        gateway at `websocket_url`. Tokens are single-use and expire quickly.
        The underlying VNC endpoint is never exposed to the client.
      operationId: getVMConsole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                console_type:
                  type: string
                  enum: [vnc, serial]
                  default: vnc
      responses:
        "200":
          description: Console access
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConsoleAccess"
        "409":
          description: VM is not running
  /console/ws:
    get:
      tags: [Console]
      summary: Console WebSocket gateway (noVNC)
      description: >
        WebSocket endpoint that a noVNC client connects to. The one-time
        `token` query parameter is validated before the gateway bridges the
        socket to the VM's VNC port.
      operationId: consoleWebsocket
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: One-time console token from POST /v1/vms/{id}/console
      responses:
        "101":
          description: Switching Protocols (WebSocket established)
        "401":
          description: Missing or invalid token

  /v1/operations/{id}:
    get:
      tags: [Operations]
      summary: Poll an asynchronous operation
      operationId: getOperation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/billing/subscription:
    get:
      tags: [Billing]
      summary: Get the current user's subscription
      operationId: getSubscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription (or null if none)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Subscription"
                  - type: object
                    nullable: true
    post:
      tags: [Billing]
      summary: Create a Stripe subscription
      operationId: createSubscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stripe_price_id]
              properties:
                stripe_price_id:
                  type: string
                  description: Stripe Price ID for the plan
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /v1/billing/invoices:
    get:
      tags: [Billing]
      summary: List the current user's invoices
      operationId: listInvoices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
  /v1/webhooks/stripe:
    post:
      tags: [Billing]
      summary: Stripe webhook endpoint
      description: >
        Verifies the `Stripe-Signature` header and processes events
        idempotently. Duplicate events are acknowledged without side effects.
      operationId: stripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event accepted
        "400":
          description: Signature verification failed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Session token from POST /v1/auth/login
  parameters:
    ResourceIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidCredentials:
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EmailTaken:
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BillingRequired:
      description: An active subscription is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoCapacity:
      description: No node has sufficient capacity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidState:
      description: The VM is not in a valid state for this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      example:
        error:
          code: RESOURCE_NOT_FOUND
          message: resource not found
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
