services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    environment:
      ENV: development
      HTTP_LISTEN_ADDRESS: :8080
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/vps?sslmode=disable
      GRPC_CLIENT_TIMEOUT: 30s
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NODE_OFFLINE_AFTER: 30s
      NODE_DEGRADED_AFTER: 15s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      AGENT_ID: agent-1
      AGENT_GRPC_LISTEN_ADDRESS: :9001
      AGENT_FAKE_MODE: "true"
      AGENT_WORK_DIR: /var/lib/vps-agent
    ports:
      - "9001:9001"
    volumes:
      - agentdata:/var/lib/vps-agent
    # NOTE: in fake mode the agent answers gRPC without a hypervisor. For real
    # provisioning the agent must run on the hypervisor host with access to
    # /var/run/libvirt/libvirt-sock and iptables.

volumes:
  pgdata:
  agentdata: